name: Publish v12 Maintenance Release

on:
  push:
    branches: [maintenance/v12]
    paths: [RELEASE_NOTES.md]

permissions:
  contents: write

concurrency:
  group: tabbed-chatlog-v12-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate v12 behavior and manifest
        run: |
          node --check tabbed-chatlog.js
          node --test chat-v12.test.cjs
      - name: Test actual Cyberpunk RED v0.92.4 roll cards in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-deps" --no-save --ignore-scripts --no-package-lock playwright@1.58.2 jquery@3.7.1 handlebars@4.7.8
          "$RUNNER_TEMP/browser-deps/node_modules/.bin/playwright" install --with-deps chromium
          NODE_MODULES_DIR="$RUNNER_TEMP/browser-deps/node_modules" node chat-cyberpunk.test.cjs
      - name: Package runtime files for Forge
        run: |
          zip -r module.zip module.json tabbed-chatlog.js languages styles LICENSE LICENSE.md
          unzip -Z1 module.zip
      - name: Publish without changing latest or existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v12-$(node -p 'require("./module.json").version')"
          test "$TAG" = "v12-1.6.7"
          LATEST_BEFORE=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.id')
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > /dev/null 2>&1; then
            echo "Release already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$TAG" module.json module.zip \
            --target "$GITHUB_SHA" --draft --latest=false \
            --title "Tabbed Chatlog 1.6.7 - Foundry v12.343 / Cyberpunk RED" \
            --notes-file RELEASE_NOTES.md
          gh release edit "$TAG" --draft=false --latest=false
          LATEST_AFTER=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.id')
          test "$LATEST_BEFORE" = "$LATEST_AFTER"
          mkdir verify
          gh release download "$TAG" --dir verify --pattern module.json --pattern module.zip
          cmp module.json verify/module.json
          cmp module.zip verify/module.zip
