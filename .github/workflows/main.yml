name: Publish v13 and Automatic Compatibility Releases

on:
  push:
    branches: [maintenance/v13]
    paths: [RELEASE_NOTES.md]

permissions:
  contents: write

concurrency:
  group: tabbed-chatlog-v13-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate v13 behavior and manifest
        run: |
          node --check tabbed-chatlog.js
          node --test chat-v13.test.cjs
      - name: Download and verify the existing v14 implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .qa/v14-reference
          gh release download 1.7.1 --pattern module.zip --dir .qa/v14-reference
          echo '58555240c07bdea8969470ad92d1289ca341c59afabeca4316c55c0e9df78b5f  .qa/v14-reference/module.zip' | sha256sum --check
          unzip -q .qa/v14-reference/module.zip -d .qa/v14-reference/extracted
          node build-automatic.cjs .qa/v14-reference/extracted
          node --experimental-vm-modules --test automatic.test.cjs
      - name: Test actual Lancer 3.1.3 cards and automatic v13 loading in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-deps" --no-save --ignore-scripts --no-package-lock playwright@1.58.2 jquery@3.7.1 handlebars@4.7.8
          export CHROME_PATH="$(command -v google-chrome)"
          export NODE_MODULES_DIR="$RUNNER_TEMP/browser-deps/node_modules"
          node chat-lancer.test.cjs
          AUTOMATIC_PACKAGE="$PWD/.qa/automatic" node chat-lancer.test.cjs
      - name: Package runtime files for Forge
        run: |
          zip -r module.zip module.json tabbed-chatlog.js languages styles LICENSE LICENSE.md
          cd .qa/automatic
          zip -r module.zip module.json loader.js runtime languages LICENSE LICENSE.md
      - name: Publish without changing latest or existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          LATEST_BEFORE=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.id')
          test "$(node -p 'require("./module.json").version')" = '1.7.2'
          test "$(node -p 'require("./automatic/module.json").version')" = '1.8.0'
          for TAG in v13-1.7.2 compat-1.8.0; do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > /dev/null 2>&1; then
              echo "Release $TAG already exists; refusing to replace it."
              exit 1
            fi
          done
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | {id, tag_name, assets: [.assets[] | {id, name, digest}]}]' > .qa/releases-before.json
          gh release create v13-1.7.2 module.json module.zip \
            --target "$GITHUB_SHA" --draft --latest=false \
            --title "Tabbed Chatlog 1.7.2 - Foundry v13.351 / Lancer 3.1.3" --notes-file RELEASE_NOTES.md
          gh release create compat-1.8.0 .qa/automatic/module.json .qa/automatic/module.zip \
            --target "$GITHUB_SHA" --draft --latest=false \
            --title "Tabbed Chatlog 1.8.0 - Automatic Foundry v13/v14" --notes-file RELEASE_NOTES.md
          gh release edit v13-1.7.2 --draft=false --latest=false
          gh release edit compat-1.8.0 --draft=false --latest=false
          LATEST_AFTER=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.id')
          test "$LATEST_BEFORE" = "$LATEST_AFTER"
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | {id, tag_name, assets: [.assets[] | {id, name, digest}]}]' > .qa/releases-after.json
          node -e 'const fs=require("fs"),assert=require("assert/strict"); const before=JSON.parse(fs.readFileSync(".qa/releases-before.json")),after=JSON.parse(fs.readFileSync(".qa/releases-after.json")); for(const r of before) assert.deepEqual(after.find(a=>a.id===r.id),r);'
          gh release download v13-1.7.2 --dir .qa/verify-v13 --pattern module.json --pattern module.zip
          gh release download compat-1.8.0 --dir .qa/verify-automatic --pattern module.json --pattern module.zip
          cmp module.json .qa/verify-v13/module.json
          cmp module.zip .qa/verify-v13/module.zip
          cmp .qa/automatic/module.json .qa/verify-automatic/module.json
          cmp .qa/automatic/module.zip .qa/verify-automatic/module.zip
